<!doctype html>
<!-- Shell do /events (fatia 4, style guide 02/11): o HTML NÃO carrega dado
     — tudo chega por /api/events (lista/paginação) e /api/events/follow
     (SSE ao vivo). Guard de sessão fica no router; o Rust nunca mais
     renderiza HTML desta página. -->
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flux — eventos</title>
<link rel="stylesheet" href="/assets/estilo.css?v=__ASSETS_V__">
<!-- painel.js ANTES do alpine: o build CDN do Alpine auto-inicia via
     queueMicrotask no fim do PRÓPRIO script — alpine:init dispara antes
     do próximo defer executar; registrado depois = componente nunca existe -->
<script defer src="/assets/painel.js?v=__ASSETS_V__" data-cfasync="false"></script>
<script defer src="/assets/alpine.min.js?v=__ASSETS_V__" data-cfasync="false"></script>
</head>
<body>
<div x-data="eventosPage">
<header class="top">
  <span class="mark">flux<span>/painel</span></span>
  <nav aria-label="Páginas">
    <a href="/">dashboard</a><a href="/projetos">projetos</a><a class="on" href="/events">eventos</a><a href="/observe">monitor</a>
  </nav>
  <div class="topdir">
    <span class="muted" x-text="vivo"></span>
    <form method="post" action="/logout" class="inline"><button class="btn ghost" type="submit">sair</button></form>
    <form method="post" action="/logout" class="inline">
      <input type="hidden" name="todos" value="1">
      <button class="btn ghost" type="submit" title="revoga sessões em todos os dispositivos">sair de todos</button>
    </form>
  </div>
</header>

<main class="wrap">
  <div class="head">
    <h1>Eventos</h1>
    <span class="sub"><span x-text="total"></span> eventos no total</span>
    <span class="sub mono" x-cloak x-show="medidor.req > 0 || medidor.err429 > 0 || medidor.err5xx > 0">
      <span x-text="medidor.req"></span> req/min ·
      <span class="warn-t" x-text="medidor.err429"></span> 429 ·
      <span class="err-t" x-text="medidor.err5xx"></span> 5xx
      <span class="muted">(últimos 5 min)</span>
    </span>
  </div>

  <div class="barra">
    <button class="chip" :class="escopo === '' && nivel === '' && busca === '' ? 'on' : ''"
            @click="escopo = ''; nivel = ''; busca = ''; filtra()">todos</button>
    <template x-for="e in escopos" :key="e">
      <button class="chip" :class="escopo === e ? 'on' : ''"
              @click="escopo = escopo === e ? '' : e; filtra()" x-text="e"></button>
    </template>
    <span class="sep"></span>
    <template x-for="n in ['info', 'warn', 'error']" :key="n">
      <button class="chip" :class="nivel === n ? 'on' : ''"
              @click="nivel = nivel === n ? '' : n; filtra()" x-text="n"></button>
    </template>
    <template x-for="a in ['dev', 'prod']" :key="a">
      <button class="chip" :class="ambiente === a ? 'on' : ''"
              @click="ambiente = ambiente === a ? '' : a; filtra()"
              x-text="a === 'dev' ? 'dev (-d)' : 'prod'"></button>
    </template>
    <select class="input" x-model="host" @change="filtra()" aria-label="filtrar por host">
      <option value="">todo host</option>
      <template x-for="h in hosts" :key="h.host">
        <option :value="h.host" x-text="h.host + ' (' + h.ambiente + ')'"></option>
      </template>
    </select>
    <input class="input" type="text" x-model="projeto" @input="buscaAoVivo()"
           placeholder="projeto…" aria-label="filtrar por projeto" style="width:9rem">
    <input class="input busca" type="text" x-model="busca" @input="buscaAoVivo()"
           placeholder="buscar na mensagem…" aria-label="buscar na mensagem">
    <label class="muted" title="esconde os eventos de info vindos do IP deste navegador (warn/error continuam)">
      <input type="checkbox" :checked="ocultarMeus" @change="alternarMeus()"> ocultar meus
    </label>
    <button class="btn" @click="alternarPausa()" x-text="pausado ? '▶ retomar' : '⏸ pausar'"></button>
    <span class="warn-t" x-cloak x-show="retidos > 0" x-text="retidos + ' retidos'"></span>
    <button class="btn ghost" x-cloak x-show="notif === 'default'" @click="pedirAvisos()">
      avisar fora da aba
    </button>
  </div>

  <table>
    <thead>
      <tr><th>quando (local)</th><th>nível</th><th>escopo</th><th>conteúdo</th></tr>
    </thead>
    <tbody x-ref="corpo">
      <template x-for="g in visiveis" :key="g.chave">
        <tr :class="g.linha">
          <td class="mono muted" :title="g.ultimo + ' UTC'" x-text="quando(g.ultimo)"></td>
          <td><span class="dot" :class="g.dot"></span></td>
          <td class="mono" x-text="g.scope"></td>
          <td>
            <template x-if="g.access">
              <div class="access">
                <code x-text="g.access.metodo + ' ' + g.access.caminho"></code>
                <span class="st" :class="g.access.st" x-text="g.access.status"></span>
                <span class="muted" x-text="g.access.dur + ' ms · ' + g.access.host"></span>
              </div>
            </template>
            <template x-if="!g.access">
              <span>
                <span x-text="g.message"></span>
                <!-- Código de resposta (schema v8): coluna nos access/waf
                     novos; fallback = parse da mensagem (linhas antigas). -->
                <template x-if="formato.stDe(g)">
                  <span class="st" :class="formato.stDe(g).classe"
                        x-text="formato.stDe(g).code"></span>
                </template>
              </span>
            </template>
            <!-- Origem do evento (03/11): "você" = ip deste navegador;
                 "host" = ip da infra. Meu-ip sem marca = internet comum. -->
            <template x-if="formato.marcaDe(g, meuIp)">
              <span class="tag" :class="formato.marcaDe(g, meuIp).classe"
                    x-text="formato.marcaDe(g, meuIp).rotulo"></span>
            </template>
            <!-- Emissor (schema v8, 04/11): clique filtra o /events pela
                 coluna de projeto (fallback de mensagem no servidor). -->
            <template x-if="formato.tagProjeto(g)">
              <a class="tag" :class="formato.tagProjeto(g).classe" @click.stop
                 :href="'/events?projeto=' + encodeURIComponent(formato.tagProjeto(g).rotulo)"
                 x-text="formato.tagProjeto(g).rotulo"></a>
            </template>
            <template x-if="g.count > 1">
              <details class="cru" @click.stop>
                <summary x-text="'×' + g.count + ' em sequência — ver horários'"></summary>
                <pre x-text="g.times.join('\n')"></pre>
              </details>
            </template>
            <details class="cru" @click.stop>
              <summary>cru</summary>
              <pre x-text="g.ultimo + ' UTC (último)' + (g.ip ? '\nip real: ' + g.ip : '') + '\n' + g.message"></pre>
            </details>
          </td>
        </tr>
      </template>
    </tbody>
  </table>

  <div class="empty" x-cloak x-show="!carregando && eventos.length === 0">nenhum evento com esse filtro</div>
  <p class="muted" x-cloak x-show="fim && eventos.length > 0">fim da trilha</p>
  <div x-ref="sentinel" class="sentinel" aria-hidden="true"></div>
</main>

<footer class="wrap-rodape">
  fluxd — painel API+SSE · horários no fuso do navegador, UTC no cru · horário do último evento no title
</footer>
</div>
<noscript><p style="padding:1rem">Este painel precisa de JavaScript: os dados chegam por API e SSE, sem recarga de página.</p></noscript>
</body>
</html>
