<!doctype html>
<!-- Shell da listagem de projetos (nova, 03/11): MESMO bloco de cards do
     dashboard, 6 por página, ao vivo pelo MESMO SSE /api/dashboard/follow
     (push só quando muda). O HTML não carrega dado. -->
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Flux — projetos</title>
<link rel="stylesheet" href="/assets/estilo.css">
<!-- painel.js ANTES do alpine: o build CDN do Alpine auto-inicia via
     queueMicrotask no fim do PRÓPRIO script — alpine:init dispara antes
     do próximo defer executar; registrado depois = componente nunca existe -->
<script defer src="/assets/painel.js" data-cfasync="false"></script>
<script defer src="/assets/alpine.min.js" data-cfasync="false"></script>
</head>
<body>
<div x-data="projetosPage">
<header class="top">
  <span class="mark">flux<span>/painel</span></span>
  <nav aria-label="Páginas">
    <a href="/">dashboard</a><a class="on" href="/projetos">projetos</a><a href="/events">eventos</a><a href="/observe">monitor</a>
  </nav>
  <div class="topdir">
    <span class="muted" x-text="vivo"></span>
    <form method="post" action="/logout" class="inline"><button class="btn ghost" type="submit">sair</button></form>
    <form method="post" action="/logout" class="inline">
      <input type="hidden" name="todos" value="1">
      <button class="btn ghost" type="submit" title="revoga sessões em todos os dispositivos">sair de todos</button>
    </form>
  </div>
</header>

<main class="wrap">
  <div class="aviso" x-cloak x-show="aviso" x-text="aviso"></div>

  <div class="head">
    <h1>Projetos</h1>
    <span class="sub"
          x-text="snap ? (snap.projetos.length + ' projetos · 6 por página') : 'carregando…'"></span>
  </div>

  <div class="grid">
    <template x-for="p in paginaAtual()" :key="p.nome">
      <div class="card">
        <h3>
          <a :href="'/projects/' + encodeURIComponent(p.nome)" x-text="p.nome"></a>
          <span class="tag dev" x-text="p.framework"></span>
        </h3>
        <template x-if="p.framework_erro">
          <p class="err-t" x-text="'flux.toml inválido: ' + p.framework_erro"></p>
        </template>
        <template x-for="e in [p.dev, p.prod]" :key="e.env">
          <div class="kv">
            <span class="tag" :class="e.env" x-text="e.env"></span>
            <span class="dot" :class="dotDe(e.estado).c"></span>
            <span x-text="dotDe(e.estado).t"></span>
            <span class="muted" x-text="'(' + e.fonte + ') · interação ' + quandoRel(e.interacao)"></span>
            <span class="err-t" x-show="e.sono_erro" x-text="e.sono_erro"></span>
          </div>
        </template>
        <div class="kv">
          <b>migrations</b>
          <span x-text="'dev ' + p.dev.aplicadas + ' · prod ' + p.prod.aplicadas"></span>
        </div>
        <div class="kv">
          <b>sync</b>
          <template x-if="p.sync">
            <span>
              <span class="dot" :class="p.sync.problems > 0 ? 'warn' : (p.sync.paused ? 'idle' : 'ok')"></span>
              <span x-text="p.sync.status"></span>
              <span class="warn-t" x-show="p.sync.last_error" x-text="p.sync.last_error"></span>
            </span>
          </template>
          <template x-if="!p.sync">
            <span class="muted">sem sessão</span>
          </template>
        </div>
        <div class="kv">
          <b>hosts</b>
          <span>
            <a :href="'https://' + p.dev_host" x-text="p.dev_host"></a> ·
            <a :href="'https://' + p.prod_host" x-text="p.prod_host"></a>
          </span>
        </div>
        <div class="acoes">
          <button class="btn" type="button"
                  :disabled="acordando[p.nome] || p.dev.estado === 'awake'"
                  @click="acordar(p.nome)">acordar</button>
        </div>
      </div>
    </template>
  </div>
  <div class="pager" x-show="paginas() > 1">
    <button class="btn ghost" type="button" @click="muda(-1)"
            :disabled="pagina <= 1">‹ anterior</button>
    <span class="muted">página <span x-text="pagina"></span> de <span x-text="paginas()"></span></span>
    <button class="btn ghost" type="button" @click="muda(1)"
            :disabled="pagina >= paginas()">próxima ›</button>
  </div>
  <div class="empty" x-cloak x-show="snap && snap.projetos.length === 0">
    Nenhum projeto registrado ainda — projetos aparecem quando o fluxd conhece o flux.toml.
  </div>
</main>

<footer class="wrap-rodape">
  fluxd — painel API+SSE · lista vive no snapshot do dashboard (mesmo SSE, push só quando muda) · horários no fuso do navegador
</footer>
</div>
<noscript><p style="padding:1rem">Este painel precisa de JavaScript: os dados chegam por API e SSE, sem recarga de página.</p></noscript>
</body>
</html>
