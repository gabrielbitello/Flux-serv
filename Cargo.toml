[workspace]
resolver = "3"
members = ["crates/flux-common", "crates/fluxd", "crates/flux-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
authors = ["Gabriel"]

[workspace.dependencies]
flux-common = { path = "crates/flux-common" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
sha2 = "0.10"
clap = { version = "4", features = ["derive", "env"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "time", "signal", "process"] }
axum = "0.8"
hyper = "1"
hyper-util = { version = "0.1", features = ["client", "client-legacy", "http1", "tokio"] }
http-body-util = "0.1"
rusqlite = { version = "0.32", features = ["bundled"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Auth do painel (08/09): Argon2id (pure Rust, sem dep de sistema) e
# getrandom para o token de sessão (CSPRNG do SO).
argon2 = "0.5"
getrandom = "0.3"
tempfile = "3"
