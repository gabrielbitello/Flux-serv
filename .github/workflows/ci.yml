name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: test
        run: cargo test --workspace

  # L0.2: engine real de Docker — os 3 testes gated (docker/sleep/schema
  # integration) retornavam cedo sem FLUX_DOCKER_URL e passavam VAZIOS.
  # Suíte COMPLETA (ajuste vinculante do revisor: pega de graça os gated
  # embutidos — ciclo.rs exec/logs/SSE, panel.rs fonte docker).
  test-engine:
    runs-on: ubuntu-latest
    services:
      docker:
        image: docker:dind
        options: >-
          --privileged
          --health-cmd "docker info"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 2375:2375
        env:
          DOCKER_TLS_CERTDIR: ""
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: test com engine real
        env:
          FLUX_DOCKER_URL: tcp://127.0.0.1:2375
        run: cargo test --workspace
